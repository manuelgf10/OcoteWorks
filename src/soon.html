<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{p_title}}</title>
<meta name="description" content="{{p_description}}">
<meta name="theme-color" content="#17171a">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="{{p_url}}">
<link rel="alternate" hreflang="en" href="{{p_alt_en}}">
<link rel="alternate" hreflang="es" href="{{p_alt_es}}">
<link rel="alternate" hreflang="x-default" href="{{p_alt_en}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OcoteWorks">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:title" content="{{p_title}}">
<meta property="og:description" content="{{p_description}}">
<meta property="og:url" content="{{p_url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{og_image}}">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/atu2ijd.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css?v={{version}}">
</head>
<body class="soon-page">
{{header}}

<main>
<div class="hero soon">
  <div class="wrap soon-grid">
    <div>
      <p class="eyebrow">{{so_eyebrow}}</p>
      <h1>Building<br><em>in progress</em></h1>
      <p class="lead">{{so_lead}}</p>
      <p class="soon-tag">{{so_tag}}</p>
      {{so_form}}
      <div class="ctas">
        <a class="btn{{so_cta1_cls}}" href="{{so_cta1_href}}">{{so_cta1}}</a>
        <a class="btn ghost" href="{{so_cta2_href}}">{{so_cta2}}</a>
      </div>
    </div>
    <figure class="soon-art">{{moto_svg}}<figcaption><span>{{so_cap}}</span><span>REV 0 · WIP</span></figcaption></figure>
  </div>
</div>
</main>

{{footer}}
</body>
</html>
