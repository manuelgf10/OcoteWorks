<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{q_title}}</title>
<meta name="description" content="{{q_description}}">
<meta name="theme-color" content="#17171a">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="{{q_url}}">
<link rel="alternate" hreflang="en" href="https://ocoteworks.com/quote/">
<link rel="alternate" hreflang="es" href="https://ocoteworks.com/es/cotizar/">
<link rel="alternate" hreflang="x-default" href="https://ocoteworks.com/quote/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OcoteWorks">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:title" content="{{q_title}}">
<meta property="og:description" content="{{q_description}}">
<meta property="og:url" content="{{q_url}}">
<meta property="og:image" content="https://ocoteworks.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ocoteworks.com/og-image.png">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/atu2ijd.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css?v={{version}}">
</head>
<body class="q-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-correo" viewBox="0 0 48 48"><path d="M6 12h36v24H6z"/><path d="M6 12l18 14 18-14"/></symbol>
</svg>

{{header}}

<main>
<div class="hero q-hero">
  <div class="wrap">
    <p class="eyebrow">{{q_eyebrow}}</p>
    <h1>{{q_h1}}</h1>
    <p class="lead">{{q_lead}}</p>
    <ul class="q-tags" aria-label="{{q_tags_label}}">{{q_tags}}</ul>
  </div>
</div>

<div class="wrap q-layout">
  <div class="q-main">
    <noscript><p class="q-noscript">{{q_noscript}} <a href="mailto:hola@ocoteworks.com">hola@ocoteworks.com</a></p></noscript>
    <form id="builder" class="q-builder" onsubmit="return false" aria-label="{{q_h1_plain}}"></form>

    <section class="q-sec q-send" id="q-send" aria-labelledby="q-h-send">
      <div class="q-head"><span class="q-code">OW-08</span><h2 id="q-h-send">{{q_send_h}}</h2><p>{{q_send_p}}</p></div>
      <form id="q-form" novalidate>
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
        <div class="q-fields">
          <label><span>{{q_name}}</span><input name="name" autocomplete="name" required></label>
          <label><span>{{q_email}}</span><input name="email" type="email" autocomplete="email" required></label>
          <label class="full"><span>{{q_projname}}</span><input name="project" placeholder="{{q_projph}}"></label>
          <label class="full"><span>{{q_notes}}</span><textarea name="notes" rows="5" placeholder="{{q_notesph}}"></textarea></label>
        </div>
        <div class="q-actions">
          <button class="btn" type="submit">{{q_submit}}</button>
          <p id="q-msg" class="q-msg" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </div>

  <aside class="q-aside" id="q-sheet-anchor" aria-labelledby="q-h-sheet">
    <div class="q-panel">
      <div class="q-panel-top"><h2 id="q-h-sheet">{{q_sheet}}</h2><span>{{q_ref}} <b id="q-ref"></b></span></div>
      <p id="q-meta" class="q-meta"></p>
      <div class="q-total">
        <span class="q-k">{{q_total}}</span>
        <output id="q-total" aria-live="polite">—</output>
        <span class="q-k">{{q_vat}}</span>
      </div>
      <div class="q-time"><span class="q-k">{{q_time}}</span><b id="q-weeks">—</b><span id="q-months" class="q-months"></span></div>
      <div id="q-gantt" class="q-gantt"></div>
      <div id="q-one" class="q-one" hidden></div>
      <a class="btn" href="#q-send">{{q_review}}</a>
      <button type="button" class="q-copy" id="q-copy">{{q_copy}}</button>
      <div id="q-summary"></div>
      <p class="q-disc">{{q_disclaimer}}</p>
    </div>
  </aside>
</div>

<div class="q-bar" aria-hidden="true">
  <div><span>{{q_bar}}</span><b id="q-bar-total">—</b></div>
  <a class="btn" href="#q-sheet-anchor" tabindex="-1">{{q_bar_cta}}</a>
</div>
</main>

{{footer}}
<script src="/assets/quote.js?v={{qversion}}" defer></script>
</body>
</html>
